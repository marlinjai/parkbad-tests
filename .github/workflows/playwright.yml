# .github/workflows/playwright.yml - GitHub Actions workflow for Playwright tests
name: Playwright Tests

on:
  # Run tests on push to main branch
  push:
    branches: [main, master]
  
  # Run tests on pull requests to main branch
  pull_request:
    branches: [main, master]
  
  # Run tests automatically every 3 days at 9 AM UTC
  schedule:
    - cron: '0 9 */3 * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (leave empty for production)'
        required: false
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        PLAYWRIGHT_BASE_URL: https://www.parkbad-gt.de

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results.json
          test-results.xml
        retention-days: 30 